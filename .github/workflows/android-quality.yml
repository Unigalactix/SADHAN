name: Android quality

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", ".github/ISSUE_TEMPLATE/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests, lint and unsigned release build
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon --console=plain
      - name: Preserve reports and unsigned artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-unsigned
          path: |
            app/build/reports/
            app/build/outputs/apk/release/
          if-no-files-found: warn

  device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 540x1200
          script: bash .github/scripts/device-quality.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/quality-evidence/
